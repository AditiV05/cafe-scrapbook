<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jaipur, a café scrapbook — 44 cafés worth your afternoon</title>
    <meta
      name="description"
      content="44 Jaipur cafés ranked by real reviews, annotated and argued over. Search in plain English: breakfast, pasta, somewhere to work."
    />
    <!-- Tab icon: the barista's head on a brown plate. Generated by
         `npm run icons` from the same sprite the cards use. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F4E8DA" />

    <!-- Link previews. og:image has to be an absolute URL, and scrapers cache
         it hard — bump a ?v= on the URL if the card is ever redrawn.
         The card itself is generated by `npm run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jaipur, a café scrapbook" />
    <meta property="og:url" content="https://cafe-scrapbook.vercel.app/" />
    <meta property="og:title" content="Jaipur, a café scrapbook" />
    <meta
      property="og:description"
      content="44 Jaipur cafés ranked by real reviews, annotated and argued over."
    />
    <meta
      property="og:image"
      content="https://cafe-scrapbook.vercel.app/og.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A scrapbook page headed “Jaipur, a café scrapbook”, with two taped index cards for Tapri Central and Zolocrust, both rated 4.9."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jaipur, a café scrapbook" />
    <meta
      name="twitter:description"
      content="44 Jaipur cafés ranked by real reviews, annotated and argued over."
    />
    <meta
      name="twitter:image"
      content="https://cafe-scrapbook.vercel.app/og.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@300;400;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
